<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#475569"/>
    </marker>
    <marker id="arrowlight2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowviolet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#9333ea"/>
    </marker>
  </defs>

  <text x="500" y="26" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">Tech Preview — every object and who reads it (BGPVIPConfig CRD, api#2972)</text>

  <!-- ===== user input ===== -->
  <rect x="30" y="52" width="200" height="96" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="130" y="74" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">install-config.yaml</text>
  <text x="130" y="92" text-anchor="middle" font-size="10" fill="#991b1b">platform.baremetal.bgpVIPConfig</text>
  <text x="130" y="106" text-anchor="middle" font-size="10" fill="#991b1b">failureDetection, peerReachability,</text>
  <text x="130" y="120" text-anchor="middle" font-size="10" fill="#991b1b">holdTimeSeconds/keepaliveTimeSeconds</text>
  <text x="130" y="134" text-anchor="middle" font-size="10" fill="#991b1b">(aligned with the CRD, installer#10931)</text>

  <!-- day-2 admin -->
  <rect x="30" y="176" width="200" height="64" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="130" y="198" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">cluster admin (day-2)</text>
  <text x="130" y="214" text-anchor="middle" font-size="10" fill="#991b1b">oc edit bgpvipconfig cluster</text>
  <text x="130" y="228" text-anchor="middle" font-size="10" fill="#991b1b">no reboot (NodeDisruptionPolicy)</text>

  <!-- installer -->
  <rect x="290" y="52" width="170" height="96" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="375" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">installer</text>
  <text x="375" y="98" text-anchor="middle" font-size="10" fill="#92400e">same validation as the CRD,</text>
  <text x="375" y="112" text-anchor="middle" font-size="10" fill="#92400e">generates the CR + the Secret</text>
  <text x="375" y="126" text-anchor="middle" font-size="10" fill="#92400e">from the install-config password</text>
  <line x1="230" y1="100" x2="285" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- ===== API objects ===== -->
  <rect x="520" y="42" width="210" height="52" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="625" y="62" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">Infrastructure "cluster"</text>
  <text x="625" y="78" text-anchor="middle" font-size="10" fill="#3730a3">vipManagement: BGP &#183; VIPs</text>

  <rect x="520" y="106" width="210" height="118" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="625" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">BGPVIPConfig "cluster"</text>
  <text x="625" y="141" text-anchor="middle" font-size="10" fill="#3730a3">machineconfiguration/v1alpha1</text>
  <text x="625" y="155" text-anchor="middle" font-size="10" fill="#3730a3">localASN &#183; defaultPeers (1-16, map)</text>
  <text x="625" y="169" text-anchor="middle" font-size="10" fill="#3730a3">communities &#183; hostOverrides (&#8804;256)</text>
  <text x="625" y="183" text-anchor="middle" font-size="10" fill="#3730a3">CEL: singleton, canonical IPs, timer</text>
  <text x="625" y="197" text-anchor="middle" font-size="10" fill="#3730a3">rules, community ranges &#8212; validated</text>
  <text x="625" y="211" text-anchor="middle" font-size="10" fill="#3730a3">at admission, day-2 editable</text>

  <rect x="780" y="106" width="190" height="76" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="875" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#6b21a8">Secret (basic-auth)</text>
  <text x="875" y="143" text-anchor="middle" font-size="10" fill="#6b21a8">ns openshift-config</text>
  <text x="875" y="157" text-anchor="middle" font-size="10" fill="#6b21a8">"password" key &#8804;80 bytes (TCP MD5)</text>
  <text x="875" y="171" text-anchor="middle" font-size="10" fill="#6b21a8">installer-created; peer.passwordSecret</text>
  <line x1="730" y1="144" x2="775" y2="144" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowviolet)"/>

  <line x1="460" y1="78" x2="515" y2="66" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="460" y1="110" x2="515" y2="140" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="488" y="132" text-anchor="middle" font-size="10" fill="#64748b">creates</text>
  <line x1="230" y1="200" x2="515" y2="185" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow2)"/>
  <text x="370" y="182" text-anchor="middle" font-size="10" fill="#dc2626">edits (admission-validated)</text>

  <!-- ghost ConfigMap -->
  <rect x="415" y="455" width="185" height="52" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="507" y="477" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">bgp-vip-config ConfigMap</text>
  <text x="507" y="493" text-anchor="middle" font-size="10" fill="#64748b">GONE &#8212; replaced by the CRD</text>

  <!-- ===== operators ===== -->
  <rect x="250" y="286" width="220" height="100" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="360" y="308" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">machine-config-operator</text>
  <text x="360" y="326" text-anchor="middle" font-size="10" fill="#92400e">watches the CR, resolves the Secret</text>
  <text x="360" y="340" text-anchor="middle" font-size="10" fill="#92400e">(type/size validated, never logged),</text>
  <text x="360" y="354" text-anchor="middle" font-size="10" fill="#92400e">serializes to the internal transport;</text>
  <text x="360" y="368" text-anchor="middle" font-size="10" fill="#92400e">writes condition Rendered (SSA)</text>

  <rect x="620" y="286" width="220" height="100" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="730" y="308" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">cluster-network-operator</text>
  <text x="730" y="326" text-anchor="middle" font-size="10" fill="#92400e">watches the CR (defaultPeers),</text>
  <text x="730" y="340" text-anchor="middle" font-size="10" fill="#92400e">copies the Secret to openshift-frr-k8s,</text>
  <text x="730" y="354" text-anchor="middle" font-size="10" fill="#92400e">renders FRRConfiguration; writes</text>
  <text x="730" y="368" text-anchor="middle" font-size="10" fill="#92400e">condition SessionsConfigured (SSA)</text>

  <line x1="580" y1="224" x2="420" y2="281" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="670" y1="224" x2="722" y2="281" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="655" y="258" text-anchor="middle" font-size="10" fill="#64748b">watch</text>
  <line x1="420" y1="286" x2="600" y2="230" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowlight2)"/>
  <line x1="760" y1="286" x2="660" y2="230" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowlight2)"/>
  <text x="540" y="266" text-anchor="middle" font-size="10" fill="#0ea5e9">status: per-condition observedGeneration</text>
  <line x1="875" y1="182" x2="470" y2="330" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowviolet)"/>
  <line x1="875" y1="182" x2="845" y2="330" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowviolet)"/>

  <!-- ===== MCO-produced objects ===== -->
  <rect x="30" y="292" width="180" height="56" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="120" y="314" text-anchor="middle" font-size="11" font-weight="600" fill="#3730a3">ControllerConfigSpec</text>
  <text x="120" y="329" text-anchor="middle" font-size="10" fill="#3730a3">.BGPVIPPeersJSON</text>
  <text x="120" y="342" text-anchor="middle" font-size="10" fill="#3730a3">UNCHANGED transport from DP</text>
  <line x1="250" y1="322" x2="215" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="30" y="418" width="360" height="112" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="210" y="439" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">rendered MachineConfig (per pool)</text>
  <text x="210" y="456" text-anchor="middle" font-size="10" fill="#3730a3">same file set as Dev Preview:</text>
  <text x="210" y="470" text-anchor="middle" font-size="10" fill="#3730a3">frr-peers.json, frr.conf.tmpl, startup files,</text>
  <text x="210" y="484" text-anchor="middle" font-size="10" fill="#3730a3">frr-k8s + kube-vip static pod manifests, hostpath unit</text>
  <text x="210" y="501" text-anchor="middle" font-size="10" fill="#3730a3">peers-file changes covered by a NodeDisruptionPolicy</text>
  <text x="210" y="515" text-anchor="middle" font-size="10" fill="#3730a3">&#8594; day-2 peer edits apply without reboots (~45s)</text>
  <line x1="120" y1="348" x2="150" y2="413" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="100" y="384" text-anchor="middle" font-size="10" fill="#64748b">templates</text>

  <!-- ===== CNO-produced objects ===== -->
  <rect x="620" y="418" width="220" height="92" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="730" y="439" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">FRRConfiguration "bgp-vip"</text>
  <text x="730" y="455" text-anchor="middle" font-size="10" fill="#3730a3">ns openshift-frr-k8s, sessions only</text>
  <text x="730" y="469" text-anchor="middle" font-size="10" fill="#3730a3">+ BFDProfile "vip-bfd"</text>
  <text x="730" y="483" text-anchor="middle" font-size="10" fill="#3730a3">neighbor passwordSecret reference</text>
  <text x="730" y="497" text-anchor="middle" font-size="10" fill="#3730a3">(frr-k8s#484 fixed upstream)</text>
  <line x1="730" y1="386" x2="730" y2="413" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="748" y="404" font-size="10" fill="#64748b">renders</text>

  <rect x="860" y="418" width="120" height="92" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="920" y="444" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">frr-metrics</text>
  <text x="920" y="458" text-anchor="middle" font-size="10" fill="#92400e">companion DS +</text>
  <text x="920" y="472" text-anchor="middle" font-size="10" fill="#92400e">Secret copy in</text>
  <text x="920" y="486" text-anchor="middle" font-size="10" fill="#92400e">openshift-frr-k8s</text>
  <line x1="820" y1="386" x2="905" y2="413" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowlight2)"/>

  <!-- ===== node ===== -->
  <rect x="30" y="560" width="940" height="150" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="45" y="582" font-size="13" font-weight="600" fill="#64748b">node &#8212; identical to Dev Preview (the transport boundary is stable)</text>

  <rect x="50" y="594" width="210" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="155" y="616" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">baremetal-runtimecfg</text>
  <text x="155" y="631" text-anchor="middle" font-size="10" fill="#166534">frr-peers.json + node identity</text>
  <text x="155" y="645" text-anchor="middle" font-size="10" fill="#166534">&#8594; renders frr.conf</text>
  <line x1="180" y1="530" x2="155" y2="589" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="290" y="594" width="330" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="455" y="614" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">static pods (masters + workers)</text>
  <text x="455" y="630" text-anchor="middle" font-size="10" fill="#166534">frr-k8s &#183; kube-vip-api(&#215;family) &#183; kube-vip-ingress(&#215;family)</text>
  <text x="455" y="645" text-anchor="middle" font-size="10" fill="#166534">contract: VIP routes in kernel table 198</text>
  <line x1="260" y1="624" x2="285" y2="624" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/>

  <rect x="650" y="594" width="310" height="60" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="805" y="614" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">frr-k8s merges FRRConfiguration CRs</text>
  <text x="805" y="630" text-anchor="middle" font-size="10" fill="#166534">static frr-k8s (masters) + CNO DaemonSet (workers)</text>
  <text x="805" y="645" text-anchor="middle" font-size="10" fill="#166534">&#8594; eBGP sessions to the ToR, ECMP VIP /32 + /128</text>
  <line x1="730" y1="510" x2="790" y2="589" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/>

  <text x="500" y="738" text-anchor="middle" font-size="10" fill="#64748b">user surface: install-config at day-0, the admission-validated BGPVIPConfig CR at day-2 &#8212; with status conditions Rendered + SessionsConfigured reporting progress</text>
</svg>
